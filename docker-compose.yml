# Minimal single-service setup. `docker compose up -d --build`, then open http://localhost:3001
# and point Settings -> Connection at your model backend.
services:
  rp:
    build: .
    ports:
      - "3001:3001"
    volumes:
      # Characters, chats, worlds, personas and every uploaded image. Back this up.
      - ./data:/app/data
    environment:
      # All four are optional and read from a `.env` beside this file (created by
      # deploy/vps-deploy.sh; see DOCKER.md). RP_ALLOWED_ORIGINS is what the browser-origin check
      # accepts beyond loopback — comma-separated, or a lone "*" to switch the check off.
      # RP_AUTH_PASSCODE turns on the passcode gate (without it the API is unauthenticated), and
      # LLM_BASE_URL / LLM_API_KEY are only for the case where a server-side proxy holds the key
      # instead of the browser.
      RP_ALLOWED_ORIGINS: "${RP_ALLOWED_ORIGINS:-}"
      RP_AUTH_PASSCODE: "${RP_AUTH_PASSCODE:-}"
      LLM_BASE_URL: "${LLM_BASE_URL:-}"
      LLM_API_KEY: "${LLM_API_KEY:-}"
      # If you also run KoboldCpp in a container, the browser reaches it directly, not through this
      # service — set the backend URL in Settings to something the browser can resolve
      # (http://host.docker.internal:5001 when KoboldCpp is on the Docker host).
      TZ: "${TZ:-UTC}"
    restart: unless-stopped
