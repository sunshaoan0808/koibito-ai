/name: docker-image

on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'package.json'
      - 'package-lock.json'
      - 'server/**'
      - 'src/**'
      - 'index.html'
      - 'vite.config.*'
      - '.github/workflows/docker-image.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/sunshaoan0808/koibito-ai:latest
            ghcr.io/sunshaoan0808/koibito-ai:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
