<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>RP Suite · 登录</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         background: #16181a; color: #e8e6e3; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  .card { width: min(360px, 90vw); background: #1f2224; border: 1px solid #33383b; border-radius: 16px; padding: 28px; }
  h1 { margin: 0 0 4px; font-size: 18px; }
  p { margin: 0 0 18px; font-size: 13px; color: #9a968f; }
  input { width: 100%; box-sizing: border-box; padding: 10px 12px; border-radius: 10px; font-size: 15px;
          border: 1px solid #33383b; background: #16181a; color: inherit; outline: none; }
  input:focus { border-color: #0d7969; }
  button { width: 100%; margin-top: 12px; padding: 10px; border-radius: 10px; border: 0; cursor: pointer;
           background: #0d7969; color: #fff; font-size: 15px; }
  button:disabled { opacity: .5; }
  .err { color: #e5484d; font-size: 13px; min-height: 18px; margin-top: 10px; }
</style>
</head>
<body>
  <form class="card" id="f">
    <h1>RP Suite</h1>
    <p>输入访问口令后继续</p>
    <input type="password" id="p" placeholder="访问口令" autofocus autocomplete="current-password" />
    <button id="b">进入</button>
    <div class="err" id="e"></div>
  </form>
  <script>
    const f = document.getElementById('f');
    const p = document.getElementById('p');
    const b = document.getElementById('b');
    const e = document.getElementById('e');
    f.addEventListener('submit', async (ev) => {
      ev.preventDefault();
      b.disabled = true; e.textContent = '';
      try {
        const r = await fetch('/api/auth/login', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ passcode: p.value }),
        });
        if (r.ok) { location.href = '/'; return; }
        const j = await r.json().catch(() => ({}));
        e.textContent = j.error || ('登录失败 ' + r.status);
      } catch { e.textContent = '网络错误'; }
      b.disabled = false;
    });
  </script>
</body>
</html>
